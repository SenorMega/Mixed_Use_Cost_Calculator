<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mixed-Use & Rent Calculator</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom Print Styles for a Condensed, Professional PDF Report */
    @media print {
      @page { margin: 0.5in; } /* Narrower margins for more content */
      body { background-color: white !important; }
      
      /* Force background colors to show in PDFs */
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      
      /* Compress layout gaps and margins */
      .space-y-6 > :not([hidden]) ~ :not([hidden]) { margin-top: 0.75rem !important; }
      .gap-6 { gap: 1rem !important; }
      
      /* Compress padding inside boxes and tables */
      .p-6 { padding: 0.75rem !important; }
      .p-4 { padding: 0.25rem 0.5rem !important; font-size: 0.85rem !important; }
      .p-3 { padding: 0.25rem !important; }
      
      /* Strip borders/backgrounds from inputs to make them look like normal text */
      input[type="number"], input[type="text"], select {
        border: none !important;
        background: transparent !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        appearance: none !important;
        -webkit-appearance: none !important;
        color: #0f172a !important;
        font-weight: 700 !important;
      }
      
      /* Make sure the main cards look like report sections and don't break across pages */
      .print-card {
        page-break-inside: avoid;
        break-inside: avoid;
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
        margin-bottom: 0.5rem !important;
        border-radius: 6px !important;
      }

      /* Tweak header sizes */
      h2 { font-size: 1rem !important; margin-bottom: 0.25rem !important; }
      h1 { font-size: 1.25rem !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    // --- Inline SVG Icons ---
    const CalculatorIcon = () => (<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16.01" y1="10" y2="10"/><line x1="16" x2="16.01" y1="14" y2="14"/><line x1="16" x2="16.01" y1="18" y2="18"/><line x1="8" x2="8.01" y1="10" y2="10"/><line x1="8" x2="8.01" y1="14" y2="14"/><line x1="12" x2="12.01" y1="10" y2="10"/><line x1="12" x2="12.01" y1="14" y2="14"/><line x1="8" x2="8.01" y1="18" y2="18"/><line x1="12" x2="12.01" y1="18" y2="18"/></svg>);
    const Building2Icon = ({ className, size }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>);
    const DollarSignIcon = ({ className, size }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>);
    const PieChartIcon = ({ className, size }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>);
    const HomeIcon = ({ className, size }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>);
    const StoreIcon = ({ className, size }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></svg>);
    const BedIcon = ({ className, size }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg>);
    const PlusIcon = ({ className, size }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>);
    const TrashIcon = ({ className, size }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>);
    const PrinterIcon = ({ className, size }) => (<svg className={className} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>);

    // Formatters
    const formatCurrency = (value) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(value);
    const formatPercent = (value) => new Intl.NumberFormat('en-US', { style: 'percent', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value);


    // --- Component 1: TIC/LLC Building Calculator ---
    function TicCalculator() {
      // Global State
      const [purchasePrice, setPurchasePrice] = useState(1700000);
      const [resRate, setResRate] = useState(900);
      const [comRate, setComRate] = useState(500);

      // Units State
      const [units, setUnits] = useState([
        { id: 1, name: 'Top Floor', type: 'Residential', sqft: 1000 },
        { id: 2, name: 'Middle Floor', type: 'Residential', sqft: 1000 },
        { id: 3, name: 'Ground Floor', type: 'Commercial', sqft: 700 },
        { id: 4, name: 'Studio', type: 'Residential', sqft: 400 },
        { id: 5, name: 'Garage', type: 'Residential', sqft: 400 },
      ]);

      // Handlers
      const handleUnitChange = (id, field, value) => {
        setUnits(units.map(unit => 
          unit.id === id ? { ...unit, [field]: value } : unit
        ));
      };

      const handleAddUnit = () => {
        const newId = units.length > 0 ? Math.max(...units.map(u => u.id)) + 1 : 1;
        setUnits([...units, { id: newId, name: 'New Unit', type: 'Residential', sqft: 500 }]);
      };

      const handleRemoveUnit = (id) => {
        if (units.length > 1) setUnits(units.filter(unit => unit.id !== id));
      };

      // Calculations
      const calculatedData = useMemo(() => {
        let totalWeightValue = 0;
        let totalSqft = 0;

        const enrichedUnits = units.map(unit => {
          const rate = unit.type === 'Residential' ? resRate : comRate;
          const weightValue = (Number(unit.sqft) || 0) * rate;
          totalWeightValue += weightValue;
          totalSqft += (Number(unit.sqft) || 0);
          return { ...unit, rate, weightValue };
        });

        return {
          totalSqft,
          totalWeightValue,
          units: enrichedUnits.map(unit => {
            const percentage = totalWeightValue > 0 ? (unit.weightValue / totalWeightValue) : 0;
            const actualCost = percentage * purchasePrice;
            return { ...unit, percentage, actualCost };
          })
        };
      }, [units, resRate, comRate, purchasePrice]);

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          {/* Left Column: Controls */}
          <div className="lg:col-span-1 space-y-6">
            
            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 print-card">
              <h2 className="text-lg font-semibold mb-4 flex items-center">
                <Building2Icon className="mr-2 text-slate-400" size={20}/> 
                Total Purchase Price
              </h2>
              <div className="relative">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none print:hidden">
                  <DollarSignIcon className="text-slate-400" size={16}/>
                </div>
                <input 
                  type="number" 
                  value={purchasePrice}
                  onChange={(e) => setPurchasePrice(Number(e.target.value))}
                  className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-lg font-medium"
                />
                <span className="hidden print:inline absolute left-0 top-1 text-lg font-bold text-slate-900">$</span>
              </div>
            </div>

            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6 print-card">
              <h2 className="text-lg font-semibold flex items-center print:hidden">
                <PieChartIcon className="mr-2 text-slate-400" size={20}/> 
                Market Valuation Rates
              </h2>
              <p className="text-sm text-slate-500 pb-2 print:hidden">Set the estimated price per sqft to establish the ratio between unit types.</p>

              <div className="space-y-3 print:space-y-1">
                <div className="flex justify-between items-center">
                  <label className="text-sm font-medium flex items-center text-indigo-700">
                    <HomeIcon className="mr-1 print:hidden" size={16} /> Residential Rate
                  </label>
                  <span className="font-semibold">{formatCurrency(resRate)} / sqft</span>
                </div>
                <input 
                  type="range" min="500" max="1500" step="25"
                  value={resRate}
                  onChange={(e) => setResRate(Number(e.target.value))}
                  className="w-full h-2 bg-indigo-200 rounded-lg appearance-none cursor-pointer accent-indigo-600 print:hidden"
                />
              </div>

              <div className="space-y-3 pt-4 border-t border-slate-100 print:border-none print:pt-1">
                <div className="flex justify-between items-center">
                  <label className="text-sm font-medium flex items-center text-emerald-700">
                    <StoreIcon className="mr-1 print:hidden" size={16} /> Commercial Rate
                  </label>
                  <span className="font-semibold">{formatCurrency(comRate)} / sqft</span>
                </div>
                <input 
                  type="range" min="200" max="1000" step="25"
                  value={comRate}
                  onChange={(e) => setComRate(Number(e.target.value))}
                  className="w-full h-2 bg-emerald-200 rounded-lg appearance-none cursor-pointer accent-emerald-600 print:hidden"
                />
              </div>
            </div>
          </div>

          {/* Right Column: Units & Results */}
          <div className="lg:col-span-2 space-y-6">
            
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-card">
              <div className="p-6 border-b border-slate-100 bg-slate-50">
                <h2 className="text-lg font-semibold">Building Layout & Units</h2>
              </div>
              <div className="p-0 overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50 text-slate-500 text-sm border-b border-slate-200">
                      <th className="p-4 font-medium">Unit Name</th>
                      <th className="p-4 font-medium">Type</th>
                      <th className="p-4 font-medium">Square Feet</th>
                      <th className="p-4 font-medium text-center w-12 print:hidden"></th>
                    </tr>
                  </thead>
                  <tbody>
                    {units.map((unit) => (
                      <tr key={unit.id} className="border-b border-slate-100 last:border-0 hover:bg-slate-50/50 transition-colors group">
                        <td className="p-4">
                          <input type="text" value={unit.name} onChange={(e) => handleUnitChange(unit.id, 'name', e.target.value)} className="w-full bg-transparent border-b border-transparent focus:border-blue-500 focus:outline-none font-medium"/>
                        </td>
                        <td className="p-4">
                          <select value={unit.type} onChange={(e) => handleUnitChange(unit.id, 'type', e.target.value)} className={`px-3 py-1.5 rounded-lg text-sm font-medium border-0 focus:ring-2 focus:ring-blue-500 outline-none ${unit.type === 'Residential' ? 'bg-indigo-50 text-indigo-700' : 'bg-emerald-50 text-emerald-700'}`}>
                            <option value="Residential">Residential</option>
                            <option value="Commercial">Commercial</option>
                          </select>
                        </td>
                        <td className="p-4">
                          <div className="flex items-center">
                            <input type="number" value={unit.sqft} onChange={(e) => handleUnitChange(unit.id, 'sqft', e.target.value)} className="w-20 px-3 py-1.5 bg-slate-100 border-transparent rounded-lg focus:bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none"/>
                            <span className="ml-1 text-slate-400 text-sm">sqft</span>
                          </div>
                        </td>
                        <td className="p-4 text-center align-middle print:hidden">
                          <button onClick={() => handleRemoveUnit(unit.id)} disabled={units.length === 1} className={`text-slate-300 transition-colors p-1.5 rounded-md ${units.length === 1 ? 'opacity-50 cursor-not-allowed' : 'hover:text-red-500 hover:bg-red-50'}`}><TrashIcon size={18} /></button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="p-3 bg-slate-50 border-t border-slate-100 flex justify-center print:hidden">
                <button onClick={handleAddUnit} className="flex items-center space-x-1 px-4 py-2 text-sm font-semibold text-blue-600 bg-blue-50 hover:bg-blue-100 rounded-lg transition-colors"><PlusIcon size={16} /><span>Add Unit</span></button>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-card">
              <div className="p-6 border-b border-slate-100 bg-blue-50/50 flex justify-between items-center">
                <h2 className="text-lg font-semibold text-blue-900">Final Cost Breakdown</h2>
                <div className="text-right">
                  <span className="text-sm text-blue-600 font-medium block">Total Building Area</span>
                  <span className="text-xl font-bold text-blue-900">{calculatedData.totalSqft.toLocaleString()} sqft</span>
                </div>
              </div>
              <div className="p-0 overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50 text-slate-500 text-sm border-b border-slate-200">
                      <th className="p-4 font-medium">Unit</th>
                      <th className="p-4 font-medium text-right">Ownership %</th>
                      <th className="p-4 font-medium text-right">Cost Split</th>
                    </tr>
                  </thead>
                  <tbody>
                    {calculatedData.units.map((unit) => (
                      <tr key={unit.id} className="border-b border-slate-100 last:border-0">
                        <td className="p-4">
                          <div className="font-medium text-slate-900">{unit.name}</div>
                          <div className="text-xs text-slate-500 mt-0.5">{unit.sqft} sqft @ {formatCurrency(unit.rate)}/sqft</div>
                        </td>
                        <td className="p-4 text-right">
                          <span className="inline-block px-2.5 py-1 bg-slate-100 rounded-md font-semibold text-slate-700">{formatPercent(unit.percentage)}</span>
                        </td>
                        <td className="p-4 text-right font-bold text-lg text-slate-900">{formatCurrency(unit.actualCost)}</td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot className="bg-slate-50">
                    <tr>
                      <td className="p-4 font-semibold text-slate-500 text-right">Total:</td>
                      <td className="p-4 text-right font-bold text-slate-900">100.00%</td>
                      <td className="p-4 text-right font-bold text-blue-600 text-xl">{formatCurrency(purchasePrice)}</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // --- Component 2: Rent Splitter Workspace ---
    function RentSplitter() {
      // Global State
      const [totalRent, setTotalRent] = useState(4200);
      const [commonSqft, setCommonSqft] = useState(500);

      // Rooms State
      const [rooms, setRooms] = useState([
        { id: 1, name: 'Master Bedroom', sqft: 250, adjustment: 100 },
        { id: 2, name: 'Bedroom 2', sqft: 150, adjustment: 0 },
        { id: 3, name: 'Small Bedroom', sqft: 100, adjustment: -50 },
      ]);

      // Handlers
      const handleRoomChange = (id, field, value) => {
        setRooms(rooms.map(room => 
          room.id === id ? { ...room, [field]: value } : room
        ));
      };

      const handleAddRoom = () => {
        const newId = rooms.length > 0 ? Math.max(...rooms.map(r => r.id)) + 1 : 1;
        setRooms([...rooms, { id: newId, name: `Bedroom ${newId}`, sqft: 150, adjustment: 0 }]);
      };

      const handleRemoveRoom = (id) => {
        if (rooms.length > 1) setRooms(rooms.filter(room => room.id !== id));
      };

      // Calculations
      const calculatedData = useMemo(() => {
        const numRooms = rooms.length;
        const totalPrivateSqft = rooms.reduce((sum, room) => sum + (Number(room.sqft) || 0), 0);
        const totalAptSqft = (Number(commonSqft) || 0) + totalPrivateSqft;
        const totalAdjustments = rooms.reduce((sum, room) => sum + (Number(room.adjustment) || 0), 0);

        const rentToSplit = (Number(totalRent) || 0) - totalAdjustments;
        const pricePerSqft = totalAptSqft > 0 ? rentToSplit / totalAptSqft : 0;
        const commonSqftPerRoom = numRooms > 0 ? (Number(commonSqft) || 0) / numRooms : 0;

        return {
          totalAptSqft,
          pricePerSqft,
          rooms: rooms.map(room => {
            const privateSqft = Number(room.sqft) || 0;
            const assignedSqft = privateSqft + commonSqftPerRoom;
            const baseCost = assignedSqft * pricePerSqft;
            const finalCost = baseCost + (Number(room.adjustment) || 0);
            
            return { 
              ...room, 
              privateSqft, 
              assignedSqft, 
              finalCost: Math.max(0, finalCost) 
            };
          })
        };
      }, [rooms, totalRent, commonSqft]);

      return (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          {/* Left Column: Controls */}
          <div className="lg:col-span-1 space-y-6">
            
            <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6 print-card">
              
              <div>
                <h2 className="text-lg font-semibold mb-2 flex items-center">
                  <DollarSignIcon className="mr-2 text-slate-400" size={20}/> 
                  Total Monthly Rent
                </h2>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none print:hidden">
                    <DollarSignIcon className="text-slate-400" size={16}/>
                  </div>
                  <input 
                    type="number" 
                    value={totalRent}
                    onChange={(e) => setTotalRent(Number(e.target.value))}
                    className="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-lg font-medium"
                  />
                  <span className="hidden print:inline absolute left-0 top-1 text-lg font-bold text-slate-900">$</span>
                </div>
              </div>

              <div className="pt-4 border-t border-slate-100 print:border-none print:pt-2">
                <h2 className="text-lg font-semibold mb-2 flex items-center">
                  <PieChartIcon className="mr-2 text-slate-400" size={20}/> 
                  Shared Common Area
                </h2>
                <p className="text-xs text-slate-500 mb-3 print:hidden">Living room, kitchen, and shared bathrooms. Divided equally among all roommates.</p>
                <div className="flex items-center">
                  <input 
                    type="number" 
                    value={commonSqft}
                    onChange={(e) => setCommonSqft(Number(e.target.value))}
                    className="w-32 px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-lg font-medium"
                  />
                  <span className="ml-2 text-slate-500 font-medium">sqft</span>
                </div>
              </div>

            </div>
            
            <div className="bg-emerald-50 rounded-2xl p-5 border border-emerald-100 print:hidden">
              <h3 className="text-sm font-bold text-emerald-800 mb-2">How Adjustments Work</h3>
              <p className="text-xs text-emerald-700 leading-relaxed">
                Add fixed dollars for perks, or subtract for drawbacks. <br/><br/>
                <strong>En-suite Bath?</strong> Add <b>100</b>.<br/>
                <strong>No closet?</strong> Add <b>-50</b>.<br/><br/>
                Adjustments are deducted from the total rent pool before the rest is split by square footage.
              </p>
            </div>

          </div>

          {/* Right Column: Rooms & Results */}
          <div className="lg:col-span-2 space-y-6">
            
            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-card">
              <div className="p-6 border-b border-slate-100 bg-slate-50">
                <h2 className="text-lg font-semibold">Bedrooms & Roommates</h2>
              </div>
              <div className="p-0 overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50 text-slate-500 text-sm border-b border-slate-200">
                      <th className="p-4 font-medium">Room Name</th>
                      <th className="p-4 font-medium">Private Area</th>
                      <th className="p-4 font-medium">Adjustments ($)</th>
                      <th className="p-4 font-medium text-center w-12 print:hidden"></th>
                    </tr>
                  </thead>
                  <tbody>
                    {rooms.map((room) => (
                      <tr key={room.id} className="border-b border-slate-100 last:border-0 hover:bg-slate-50/50 transition-colors">
                        <td className="p-4">
                          <input type="text" value={room.name} onChange={(e) => handleRoomChange(room.id, 'name', e.target.value)} className="w-full bg-transparent border-b border-transparent focus:border-emerald-500 focus:outline-none font-medium"/>
                        </td>
                        <td className="p-4">
                          <div className="flex items-center">
                            <input type="number" value={room.sqft} onChange={(e) => handleRoomChange(room.id, 'sqft', e.target.value)} className="w-20 px-3 py-1.5 bg-slate-100 border-transparent rounded-lg focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none"/>
                            <span className="ml-1 text-slate-400 text-sm">sqft</span>
                          </div>
                        </td>
                        <td className="p-4">
                          <div className="flex items-center">
                            <span className="text-slate-400 mr-1 print:hidden">$</span>
                            <input type="number" value={room.adjustment} onChange={(e) => handleRoomChange(room.id, 'adjustment', e.target.value)} className="w-20 px-3 py-1.5 bg-slate-100 border-transparent rounded-lg focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none font-medium"/>
                          </div>
                        </td>
                        <td className="p-4 text-center align-middle print:hidden">
                          <button onClick={() => handleRemoveRoom(room.id)} disabled={rooms.length === 1} className={`text-slate-300 transition-colors p-1.5 rounded-md ${rooms.length === 1 ? 'opacity-50 cursor-not-allowed' : 'hover:text-red-500 hover:bg-red-50'}`}><TrashIcon size={18} /></button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="p-3 bg-slate-50 border-t border-slate-100 flex justify-center print:hidden">
                <button onClick={handleAddRoom} className="flex items-center space-x-1 px-4 py-2 text-sm font-semibold text-emerald-600 bg-emerald-50 hover:bg-emerald-100 rounded-lg transition-colors"><PlusIcon size={16} /><span>Add Room</span></button>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden print-card">
              <div className="p-6 border-b border-slate-100 bg-emerald-50/50 flex justify-between items-center">
                <h2 className="text-lg font-semibold text-emerald-900">Fair Rent Breakdown</h2>
                <div className="text-right">
                  <span className="text-sm text-emerald-600 font-medium block">Total Apt Size</span>
                  <span className="text-xl font-bold text-emerald-900">{calculatedData.totalAptSqft.toLocaleString()} sqft</span>
                </div>
              </div>
              <div className="p-0 overflow-x-auto">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="bg-slate-50 text-slate-500 text-sm border-b border-slate-200">
                      <th className="p-4 font-medium">Roommate</th>
                      <th className="p-4 font-medium text-right hidden sm:table-cell print:table-cell">True Footprint</th>
                      <th className="p-4 font-medium text-right">Monthly Rent</th>
                    </tr>
                  </thead>
                  <tbody>
                    {calculatedData.rooms.map((room) => (
                      <tr key={room.id} className="border-b border-slate-100 last:border-0">
                        <td className="p-4">
                          <div className="font-medium text-slate-900 flex items-center">
                            <BedIcon size={16} className="mr-2 text-slate-400 print:hidden" />
                            {room.name}
                          </div>
                          {room.adjustment !== 0 && (
                            <div className="text-xs text-emerald-600 mt-1 font-medium">
                              Includes {room.adjustment > 0 ? '+' : ''}{formatCurrency(room.adjustment)} adjustment
                            </div>
                          )}
                        </td>
                        <td className="p-4 text-right hidden sm:table-cell print:table-cell">
                          <span className="inline-block px-2.5 py-1 bg-slate-100 rounded-md text-sm text-slate-600">{room.assignedSqft.toFixed(0)} sqft</span>
                          <div className="text-[10px] text-slate-400 mt-1 uppercase tracking-wider">Private + Shared</div>
                        </td>
                        <td className="p-4 text-right font-bold text-lg text-slate-900">{formatCurrency(room.finalCost)}</td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot className="bg-slate-50">
                    <tr>
                      <td className="p-4 font-semibold text-slate-500 text-right hidden sm:table-cell print:table-cell" colSpan="2">Total:</td>
                      <td className="p-4 font-semibold text-slate-500 text-right sm:hidden print:hidden">Total:</td>
                      <td className="p-4 text-right font-bold text-emerald-600 text-xl">{formatCurrency(totalRent)}</td>
                    </tr>
                  </tfoot>
                </table>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // --- Main Application Wrapper ---
    function App() {
      // Tab State
      const [activeTab, setActiveTab] = useState('tic');

      return (
        <div className="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-800">
          <div className="max-w-5xl mx-auto space-y-6">
            
            {/* Header & Tabs */}
            <div className="bg-white rounded-2xl p-2 shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4 print:hidden">
              
              <div className="flex items-center space-x-3 px-4 py-2">
                <div className={`p-2 rounded-xl ${activeTab === 'tic' ? 'bg-blue-100 text-blue-600' : 'bg-emerald-100 text-emerald-600'}`}>
                  {activeTab === 'tic' ? <Building2Icon size={24} /> : <HomeIcon size={24} />}
                </div>
                <div>
                  <h1 className="text-xl font-bold text-slate-900">Fair Share Calculator</h1>
                </div>
              </div>

              {/* Action Buttons Container */}
              <div className="flex items-center gap-4">
                
                {/* Print Button */}
                <button 
                  onClick={() => window.print()}
                  className="flex items-center space-x-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold transition-colors"
                >
                  <PrinterIcon size={18} />
                  <span className="hidden sm:inline">Save PDF</span>
                </button>

                {/* Tab Toggles */}
                <div className="flex p-1 bg-slate-100 rounded-xl w-full md:w-auto">
                  <button 
                    onClick={() => setActiveTab('tic')}
                    className={`flex-1 md:flex-none px-6 py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 ${
                      activeTab === 'tic' 
                        ? 'bg-white text-blue-600 shadow-sm border border-slate-200/50' 
                        : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200/50'
                    }`}
                  >
                    Building Purchase
                  </button>
                  <button 
                    onClick={() => setActiveTab('rent')}
                    className={`flex-1 md:flex-none px-6 py-2.5 text-sm font-semibold rounded-lg transition-all duration-200 ${
                      activeTab === 'rent' 
                        ? 'bg-white text-emerald-600 shadow-sm border border-slate-200/50' 
                        : 'text-slate-500 hover:text-slate-700 hover:bg-slate-200/50'
                    }`}
                  >
                    Apartment Rent
                  </button>
                </div>
              </div>

            </div>
            
            {/* Print Only Header (Visible only in PDF/Print) */}
            <div className="hidden print:flex items-center space-x-3 mb-6 pb-4 border-b border-slate-200">
               <div className="p-2 rounded-xl bg-slate-100 text-slate-700">
                  <CalculatorIcon />
                </div>
                <div>
                  <h1 className="text-2xl font-bold text-slate-900">Fair Share Calculator</h1>
                  <p className="text-sm text-slate-500 mt-1">
                    {activeTab === 'tic' ? 'Building Purchase Cost Breakdown' : 'Apartment Rent Cost Breakdown'}
                  </p>
                </div>
            </div>

            {/* Render Active Component */}
            {activeTab === 'tic' ? <TicCalculator /> : <RentSplitter />}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
